# =============================================================================
# Docker Compose Configuration for Game-Plug
# =============================================================================
# Production-ready configuration with health checks and restart policies
# For development, use: docker compose up -d
# For production, use central deployment: docker compose -f docker-compose.apps.yml up -d game-plug
# =============================================================================

version: '3.8'

services:
  # ==========================================================================
  # PostgreSQL 16 - Database Service
  # ==========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: game-plug-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-game_plug}
      POSTGRES_USER: ${POSTGRES_USER:-game_plug}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-game_plug_dev_password}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"  # localhost only
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-game_plug} -d ${POSTGRES_DB:-game_plug}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - game-plug-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ==========================================================================
  # Redis 7 - Cache & Session Store
  # ==========================================================================
  redis:
    image: redis:7-alpine
    container_name: game-plug-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_dev_password}
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"  # localhost only
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_dev_password}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - game-plug-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ==========================================================================
  # NestJS Backend Service
  # ==========================================================================
  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: game-plug-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Application
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 5002

      # Database
      DATABASE_URL: postgresql://${POSTGRES_USER:-game_plug}:${POSTGRES_PASSWORD:-game_plug_dev_password}@postgres:5432/${POSTGRES_DB:-game_plug}

      # Redis
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_dev_password}@redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_dev_password}

      # Security
      JWT_SECRET: ${JWT_SECRET:-change-this-in-production}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400}

      # API
      API_HOST: ${API_HOST:-0.0.0.0}
      API_PORT: 5002
      API_PREFIX: ${API_PREFIX:-/api}

      # CORS
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173,http://localhost:3000}

      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-info}

    volumes:
      # Persist application data
      - ./apps/backend/src:/app/src:ro
      - ./apps/backend/dist:/app/dist
    ports:
      - "127.0.0.1:${BACKEND_PORT:-5002}:5002"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5002/api/health"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    networks:
      - game-plug-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # ==========================================================================
  # Next.js 16 Frontend Service (Bun Runtime)
  # ==========================================================================
  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5002}
    container_name: game-plug-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      # Application
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000

      # API Configuration
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://backend:5002}

      # Build-time variables
      NEXT_TELEMETRY_DISABLED: 1

    volumes:
      - ./apps/frontend/.next:/app/.next
      - ./apps/frontend/public:/app/public:ro
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "bun", "run", "--no-install", "echo", "OK"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    networks:
      - game-plug-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# =============================================================================
# Volumes
# =============================================================================
volumes:
  postgres_data:
    name: game-plug-postgres-data
    driver: local
  redis_data:
    name: game-plug-redis-data
    driver: local

# =============================================================================
# Networks
# =============================================================================
networks:
  game-plug-network:
    name: game-plug-network
    driver: bridge
