version: '3.8'

services:
  db:
    env_file: .env.staging
    image: postgres:16-alpine
    container_name: game-plug-db-staging
    environment:
      POSTGRES_DB: game_plug
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - game-plug-postgres-staging-restored:/var/lib/postgresql/data
    ports:
      - "15432:5432"
    networks:
      - game-plug-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    env_file: .env.staging
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: game-plug-backend-staging
    ports:
      - "15001:5001"
    environment:
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD:-postgres}@db:5432/game_plug
      SESSION_SECRET: ${SESSION_SECRET:-change-me-in-production}
      PORT: 5001
      FRONTEND_URL: http://localhost:13000
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - game-plug-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: game-plug-frontend-staging
    ports:
      - "13000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:15001
      NEXT_PUBLIC_WS_URL: ws://localhost:15001
    depends_on:
      - backend
    networks:
      - game-plug-network
    restart: unless-stopped

networks:
  game-plug-network:
    driver: bridge

volumes:
  game-plug_game-plug-dev-postgres-data:
    external: true
