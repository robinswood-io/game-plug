name: Docker Deployment Contract

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/backend/Dockerfile'
      - 'apps/frontend/Dockerfile'
      - 'compose.production.yml'
      - '.github/workflows/deploy.yml'
      - '.github/workflows/deploy-production.yml'
      - '.github/workflows/docker-build-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canonical-contract:
    name: Validate canonical Docker contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Validate image-only production manifest
        run: |
          set -euo pipefail
          env_file=$(mktemp)
          trap 'rm -f "$env_file"' EXIT
          printf '%s\n' \
            'DATABASE_URL=postgresql://test:test@db:5432/test' \
            'REDIS_URL=redis://redis:6379' \
            'JWT_SECRET=contract-only' \
            'GAMEPLUG_DEMO_AUTH_ENABLED=false' > "$env_file"

          export GAMEPLUG_FRONTEND_IMAGE=example/frontend:test
          export GAMEPLUG_BACKEND_IMAGE=example/backend:test
          export GAMEPLUG_BACKEND_ENV_FILE="$env_file"
          docker compose -f compose.production.yml config --quiet

          services=$(docker compose -f compose.production.yml config --services)
          printf '%s\n' "$services" | grep -qx game-plug
          printf '%s\n' "$services" | grep -qx game-plug-backend
          if printf '%s\n' "$services" | grep -Eq 'postgres|redis'; then
            echo 'Production manifest must reuse external data services, not create parallel ones.'
            exit 1
          fi

      - name: Verify monorepo-root build contract
        run: |
          set -euo pipefail
          grep -q 'context: \.' .github/workflows/deploy.yml
          grep -q 'file: ./apps/' .github/workflows/deploy.yml
          grep -q '/Dockerfile' .github/workflows/deploy.yml
          grep -q 'COPY package.json bun.lock' apps/backend/Dockerfile
          grep -q 'COPY package.json bun.lock' apps/frontend/Dockerfile
