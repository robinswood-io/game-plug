name: Backend CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'apps/backend/**'
      - 'shared/**'
      - '.github/workflows/backend-ci.yml'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    branches: [main, develop]
    paths:
      - 'apps/backend/**'
      - 'shared/**'
      - '.github/workflows/backend-ci.yml'
      - 'package.json'
      - 'package-lock.json'


permissions:
  contents: read
  issues: write
  pull-requests: write

env:
  NODE_VERSION: '20'
  POSTGRES_DB: game_plug_test
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres_test
  JWT_SECRET: test-jwt-secret-key
  SESSION_SECRET: test-session-secret-key

jobs:
  backend-ci:
    name: Backend Tests and Build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ${{ env.POSTGRES_DB }}
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Install backend dependencies
        working-directory: ./apps/backend
        run: npm ci --prefer-offline --no-audit

      - name: Verify PostgreSQL connection
        run: |
          npx pg-isready -h localhost -p 5432 -U ${{ env.POSTGRES_USER }} || true

      - name: Setup test database
        run: |
          PGPASSWORD=${{ env.POSTGRES_PASSWORD }} psql -h localhost -U ${{ env.POSTGRES_USER }} -d ${{ env.POSTGRES_DB }} -c "SELECT version();"

      - name: TypeScript check (backend)
        working-directory: ./apps/backend
        run: npx tsc --noEmit

      - name: Lint backend code
        working-directory: ./apps/backend
        run: npm run lint --if-present

      - name: Run backend unit tests
        working-directory: ./apps/backend
        run: npm run test:cov --if-present
        env:
          DATABASE_URL: postgresql://${{ env.POSTGRES_USER }}:${{ env.POSTGRES_PASSWORD }}@localhost:5432/${{ env.POSTGRES_DB }}
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: ${{ env.JWT_SECRET }}
          SESSION_SECRET: ${{ env.SESSION_SECRET }}
          NODE_ENV: test

      - name: Run backend e2e tests
        working-directory: ./apps/backend
        run: npm run test:e2e --if-present
        env:
          DATABASE_URL: postgresql://${{ env.POSTGRES_USER }}:${{ env.POSTGRES_PASSWORD }}@localhost:5432/${{ env.POSTGRES_DB }}
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: ${{ env.JWT_SECRET }}
          SESSION_SECRET: ${{ env.SESSION_SECRET }}
          NODE_ENV: test

      - name: Build backend
        working-directory: ./apps/backend
        run: npm run build
        env:
          NODE_ENV: production

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: ./apps/backend/coverage/lcov.info
          flags: backend
          fail_ci_if_error: false
          verbose: true

      - name: Comment PR with test results
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const coverage = fs.existsSync('./apps/backend/coverage/coverage-summary.json')
              ? JSON.parse(fs.readFileSync('./apps/backend/coverage/coverage-summary.json', 'utf8'))
              : null;

            let comment = '## Backend CI Status\n\n';
            comment += '✓ TypeScript check passed\n';
            comment += '✓ Lint check passed\n';
            comment += '✓ Unit tests passed\n';
            comment += '✓ Build succeeded\n';

            if (coverage && coverage.total) {
              const lines = coverage.total.lines;
              comment += `\n### Coverage\n`;
              comment += `- Lines: ${lines.pct}%\n`;
            }

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

      - name: Check if build artifacts exist
        run: |
          if [ -d "apps/backend/dist" ]; then
            echo "✓ Build artifacts generated successfully"
            ls -la apps/backend/dist | head -10
          else
            echo "✗ Build artifacts directory not found"
            exit 1
          fi
