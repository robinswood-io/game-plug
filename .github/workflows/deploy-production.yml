name: Deploy Production

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/backend/**'
      - 'apps/frontend/**'
      - 'shared/**'
      - 'package.json'
      - 'bun.lock'
      - 'compose.production.yml'
      - '.github/workflows/deploy.yml'
      - '.github/workflows/deploy-production.yml'
  push:
    branches: [main]
    paths:
      - 'apps/backend/**'
      - 'apps/frontend/**'
      - 'shared/**'
      - 'package.json'
      - 'bun.lock'
      - 'compose.production.yml'
      - '.github/workflows/deploy.yml'
      - '.github/workflows/deploy-production.yml'
  workflow_dispatch:

concurrency:
  group: game-plug-production-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  validate-contract:
    name: Validate deployment contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Validate builds and security gates
        run: |
          set -euo pipefail
          bun install --frozen-lockfile --ignore-scripts
          bun run build:backend
          bun run --cwd apps/backend test -- --config jest.config.ts --runInBand \
            src/modules/auth/auth.service.spec.ts \
            src/modules/auth/auth.controller.spec.ts \
            src/modules/auth/middleware/demo-token-policy.middleware.spec.ts \
            src/modules/characters/characters.authorization.spec.ts \
            src/modules/effects/effects.authorization.spec.ts
          bun run --cwd apps/frontend type-check
          bun run build:frontend

      - name: Validate production Compose schema
        run: |
          set -euo pipefail
          env_file=$(mktemp)
          trap 'rm -f "$env_file"' EXIT
          printf '%s\n' \
            'DATABASE_URL=postgresql://test:test@db:5432/test' \
            'REDIS_URL=redis://redis:6379' \
            'JWT_SECRET=contract-only' \
            'GAMEPLUG_DEMO_AUTH_ENABLED=false' > "$env_file"
          GAMEPLUG_FRONTEND_IMAGE=example/frontend:test \
          GAMEPLUG_BACKEND_IMAGE=example/backend:test \
          GAMEPLUG_BACKEND_ENV_FILE="$env_file" \
            docker compose -f compose.production.yml config --quiet

  deployment-readiness:
    name: Check explicit deployment readiness
    runs-on: ubuntu-latest
    needs: validate-contract
    outputs:
      ready: ${{ steps.gate.outputs.ready }}
    env:
      DEPLOY_ENABLED: ${{ vars.GAMEPLUG_CANONICAL_DEPLOY_ENABLED }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
      GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
    steps:
      - name: Fail closed unless target and credentials are explicit
        id: gate
        run: |
          set -euo pipefail
          ready=true
          [ "$DEPLOY_ENABLED" = 'true' ] || ready=false
          for value in "$DEPLOY_HOST" "$DEPLOY_USER" "$DEPLOY_KEY" "$GHCR_USERNAME" "$GHCR_TOKEN"; do
            [ -n "$value" ] || ready=false
          done
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
          if [ "$ready" != true ]; then
            echo 'Production deploy skipped: canonical deploy variable/secrets are not fully configured.'
          fi

  build-images:
    name: Build immutable production images
    needs: validate-contract
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/deploy.yml
    with:
      push_images: true
      image_tag: ${{ github.sha }}
    secrets: inherit

  deploy:
    name: Deploy canonical image manifest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [validate-contract, deployment-readiness, build-images]
    if: >-
      always() &&
      needs.validate-contract.result == 'success' &&
      needs.build-images.result == 'success' &&
      needs.deployment-readiness.outputs.ready == 'true' &&
      github.event_name != 'pull_request'
    environment: production
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
      BACKEND_IMAGE: ghcr.io/${{ github.repository }}-backend:${{ github.sha }}
      FRONTEND_IMAGE: ghcr.io/${{ github.repository }}-frontend:${{ github.sha }}
    steps:
      - name: Deploy by SSH with bounded rollback
        uses: appleboy/ssh-action@v1.2.2
        env:
          GHCR_USERNAME: ${{ env.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ env.GHCR_TOKEN }}
          BACKEND_IMAGE: ${{ env.BACKEND_IMAGE }}
          FRONTEND_IMAGE: ${{ env.FRONTEND_IMAGE }}
          DEPLOY_SHA: ${{ github.sha }}
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          key: ${{ env.DEPLOY_KEY }}
          port: ${{ env.DEPLOY_PORT || 22 }}
          timeout: 120s
          command_timeout: 900s
          envs: GHCR_USERNAME,GHCR_TOKEN,BACKEND_IMAGE,FRONTEND_IMAGE,DEPLOY_SHA
          script: |
            set -euo pipefail
            root=/srv/workspace/game-plug
            backend_env=/srv/workspace/.secrets/gameplug-backend.env
            cd "$root"

            git fetch origin main
            git checkout --detach "$DEPLOY_SHA"

            for key in DATABASE_URL REDIS_URL JWT_SECRET GAMEPLUG_DEMO_AUTH_ENABLED; do
              grep -q "^${key}=" "$backend_env" || { echo "Missing backend env key: $key"; exit 1; }
            done
            grep -q '^GAMEPLUG_DEMO_AUTH_ENABLED=false$' "$backend_env" || {
              echo 'Public demo auth must remain disabled.'
              exit 1
            }

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
            export GAMEPLUG_BACKEND_IMAGE="$BACKEND_IMAGE"
            export GAMEPLUG_FRONTEND_IMAGE="$FRONTEND_IMAGE"
            export GAMEPLUG_BACKEND_ENV_FILE="$backend_env"

            docker compose -f compose.production.yml config --quiet
            docker compose -f compose.production.yml pull

            rollback() {
              echo 'Canonical image deployment failed; restoring the verified source-runtime bridge.'
              docker rm -f game-plug game-plug-backend >/dev/null 2>&1 || true
              cd /srv/workspace
              docker compose -f docker-compose.apps.yml \
                -f game-plug/compose.dev-runtime.override.yml \
                up -d --force-recreate game-plug game-plug-backend
            }
            trap rollback ERR

            docker rm -f game-plug game-plug-backend >/dev/null 2>&1 || true
            docker compose -f compose.production.yml up -d

            for attempt in $(seq 1 30); do
              frontend_health=$(docker inspect game-plug --format '{{.State.Health.Status}}' 2>/dev/null || true)
              backend_health=$(docker inspect game-plug-backend --format '{{.State.Health.Status}}' 2>/dev/null || true)
              if [ "$frontend_health" = healthy ] && [ "$backend_health" = healthy ]; then break; fi
              sleep 2
            done

            test "$(docker inspect game-plug --format '{{.State.Health.Status}}')" = healthy
            test "$(docker inspect game-plug-backend --format '{{.State.Health.Status}}')" = healthy
            curl --fail --silent --show-error https://game-plug.rbw.ovh/ >/dev/null
            curl --fail --silent --show-error https://game-plug.rbw.ovh/api/health >/dev/null
            trap - ERR
