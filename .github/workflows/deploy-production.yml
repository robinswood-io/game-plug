name: Deploy Production

on:
  pull_request:
    branches: [main]
    paths:
      - apps/backend/**
      - apps/frontend/**
      - shared/**
      - package.json
      - bun.lock
      - compose.production.yml
      - .github/workflows/deploy.yml
      - .github/workflows/deploy-production.yml
      - .github/scripts/assert_deploy_executor_contract.py
      - .github/actionlint.yaml
      - ops/deploy-executor/**
  workflow_dispatch:

concurrency:
  group: game-plug-production-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate-contract:
    name: Validate deployment and executor contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Validate builds and security gates
        run: |
          set -euo pipefail
          bun install --frozen-lockfile || test -d node_modules --ignore-scripts || test -d node_modules
          bun run build:backend
          bun run --cwd apps/backend test -- --config jest.config.ts --runInBand \
            src/modules/auth/auth.service.spec.ts \
            src/modules/auth/auth.controller.spec.ts \
            src/modules/auth/middleware/demo-token-policy.middleware.spec.ts \
            src/modules/characters/characters.authorization.spec.ts \
            src/modules/effects/effects.authorization.spec.ts
          bun run --cwd apps/frontend type-check
          bun run build:frontend
      - name: Validate production Compose schema
        run: |
          set -euo pipefail
          env_file=$(mktemp)
          trap 'rm -f "$env_file"' EXIT
          printf '%s\n' \
            DATABASE_URL=postgresql://test:test@db:5432/test \
            REDIS_URL=redis://redis:6379 \
            JWT_SECRET=contract-only \
            GAMEPLUG_DEMO_AUTH_ENABLED=false > "$env_file"
          chmod 600 "$env_file"
          GAMEPLUG_FRONTEND_IMAGE=example/frontend@sha256:$(printf frontend | sha256sum | cut -d' ' -f1) \
          GAMEPLUG_BACKEND_IMAGE=example/backend@sha256:$(printf backend | sha256sum | cut -d' ' -f1) \
          GAMEPLUG_BACKEND_ENV_FILE="$env_file" \
            docker compose -f compose.production.yml config --quiet
      - name: Prove pull-request jobs cannot execute on deployment runner
        run: python3 .github/scripts/assert_deploy_executor_contract.py

  deployment-readiness:
    name: Check explicit deployment readiness
    runs-on: ubuntu-latest
    needs: validate-contract
    permissions:
      contents: read
    outputs:
      ready: ${{ steps.gate.outputs.ready }}
    env:
      DEPLOY_ENABLED: ${{ vars.GAMEPLUG_CANONICAL_DEPLOY_ENABLED }}
    steps:
      - name: Fail closed until reviewed architecture is activated
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: |
          set -euo pipefail
          ready=false
          if [ "$DEPLOY_ENABLED" = true ] && \
             [ "$EVENT_NAME" = workflow_dispatch ] && \
             [ "$REF_NAME" = refs/heads/main ] && \
             [ "$ACTOR" = Aoleon ] && \
             [ "$TRIGGERING_ACTOR" = Aoleon ]; then
            ready=true
          fi
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
          if [ "$ready" != true ]; then
            echo 'Canonical deployment remains disabled or is not a manual Aoleon dispatch from main.'
          fi

  build-images:
    name: Build immutable production images
    needs: validate-contract
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/deploy.yml
    with:
      push_images: true
      image_tag: ${{ github.sha }}

  deploy:
    name: Deploy through isolated GamePlug executor
    runs-on: [gameplug-canonical-deploy, repo-game-plug, trusted-main-only]
    timeout-minutes: 20
    needs: [validate-contract, deployment-readiness, build-images]
    if: >-
      always() &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'Aoleon' &&
      github.triggering_actor == 'Aoleon' &&
      needs.validate-contract.result == 'success' &&
      needs.build-images.result == 'success' &&
      needs.deployment-readiness.outputs.ready == 'true'
    environment: production
    permissions:
      contents: read
    env:
      BACKEND_DIGEST: ${{ needs.build-images.outputs.backend_digest }}
      FRONTEND_DIGEST: ${{ needs.build-images.outputs.frontend_digest }}
    steps:
      - name: Validate immutable manifest inputs
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$BACKEND_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$FRONTEND_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
      - name: Invoke only the forced-command deployment identity
        run: |
          set -euo pipefail
          exec ssh -F /dev/null \
            -i /var/lib/gameplug-runner/.ssh/id_ed25519 \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=/var/lib/gameplug-runner/.ssh/known_hosts \
            -o ConnectTimeout=15 \
            ubuntu@164.132.161.150 \
            "deploy $GITHUB_SHA $BACKEND_DIGEST $FRONTEND_DIGEST"
