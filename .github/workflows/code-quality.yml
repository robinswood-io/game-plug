name: Code Quality & Security

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Run security checks daily at 2 AM UTC
    - cron: '0 2 * * *'

env:
  NODE_VERSION: '20'

jobs:
  quality-checks:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Run backend linting
        working-directory: ./apps/backend
        run: npm run lint --if-present
        continue-on-error: true

      - name: Run frontend linting
        working-directory: ./apps/frontend
        run: npm run lint --if-present
        continue-on-error: true

      - name: Check for console statements
        run: |
          echo "Checking for console.log statements..."
          ! grep -r "console\.log\|console\.debug" apps/backend/src apps/frontend/src --include="*.ts" --include="*.tsx" || echo "⚠ Warning: console statements found"

      - name: Check for TODO/FIXME comments
        run: |
          echo "Checking for TODO/FIXME comments..."
          grep -r "TODO\|FIXME" apps/backend/src apps/frontend/src --include="*.ts" --include="*.tsx" || echo "✓ No TODO/FIXME comments found"

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Run npm audit
        run: npm audit --audit-level=moderate || true
        continue-on-error: true

      - name: Check for vulnerable dependencies
        run: |
          echo "Running security vulnerability check..."
          npm audit --json > audit-report.json || true

          # Extract vulnerability count
          VULNERABILITIES=$(jq '.metadata.vulnerabilities.total' audit-report.json)
          echo "Total vulnerabilities found: $VULNERABILITIES"

          if [ "$VULNERABILITIES" -gt 0 ]; then
            echo "⚠ Vulnerabilities detected:"
            jq '.vulnerabilities | keys[]' audit-report.json
          fi

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: audit-report.json
          retention-days: 30

  dependency-check:
    name: Dependency Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Check for outdated dependencies
        run: |
          echo "Checking for outdated dependencies..."
          npm outdated || true

      - name: Check dependency licenses
        run: |
          echo "Checking dependency licenses..."
          npm run check:licenses --if-present || echo "License check script not found"

      - name: Analyze package size
        run: |
          echo "Analyzing package sizes..."
          find . -name "node_modules" -type d -exec du -sh {} \; | head -5

  type-safety:
    name: Type Safety Check
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: TypeScript strict check (backend)
        working-directory: ./apps/backend
        run: npx tsc --noEmit
        continue-on-error: false

      - name: TypeScript strict check (frontend)
        working-directory: ./apps/frontend
        run: npx tsc --noEmit
        continue-on-error: false

      - name: Check for 'any' type usage
        run: |
          echo "Checking for 'any' type usage..."
          if grep -r ": any" apps/backend/src apps/frontend/src --include="*.ts" --include="*.tsx" | grep -v "node_modules"; then
            echo "⚠ Warning: 'any' type found in source code"
          else
            echo "✓ No 'any' types found"
          fi

  comment-pr:
    name: Comment PR with Results
    runs-on: ubuntu-latest
    needs: [quality-checks, security-audit, type-safety]
    if: github.event_name == 'pull_request' && always()

    steps:
      - name: Comment PR
        uses: actions/github-script@v7
        with:
          script: |
            const qualityStatus = '${{ needs.quality-checks.result }}' === 'success' ? '✓' : '⚠';
            const securityStatus = '${{ needs.security-audit.result }}' === 'success' ? '✓' : '⚠';
            const typeStatus = '${{ needs.type-safety.result }}' === 'success' ? '✓' : '⚠';

            const comment = `## Code Quality & Security Report

            ${qualityStatus} **Linting**: ${{ needs.quality-checks.result }}
            ${securityStatus} **Security Audit**: ${{ needs.security-audit.result }}
            ${typeStatus} **Type Safety**: ${{ needs.type-safety.result }}

            ### Checks Performed
            - ESLint code style verification
            - TypeScript strict mode validation
            - NPM security audit
            - Dependency analysis
            - Console statement detection
            - TODO/FIXME comment detection

            For details, see the workflow run: [CI Logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
