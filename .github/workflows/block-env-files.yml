name: Block committed .env files
on:
  push:
  pull_request:
jobs:
  guard-env-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail on forbidden .env* files
        run: |
          set -euo pipefail
          bad=$(git ls-files | awk -F/ '{n=$NF} n ~ /^\.env/ && n != ".env.example" {print}')
          if [ -n "$bad" ]; then
            echo "Forbidden tracked files detected:"
            echo "$bad"
            exit 1
          fi
