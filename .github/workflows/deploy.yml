name: Build Deployment Images

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/backend/**'
      - 'apps/frontend/**'
      - 'shared/**'
      - 'package.json'
      - 'bun.lock'
      - 'compose.production.yml'
      - '.github/workflows/deploy.yml'
  workflow_call:
    inputs:
      push_images:
        type: boolean
        required: false
        default: false
      image_tag:
        type: string
        required: false
        default: ''
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-images:
    name: Build ${{ matrix.app }} image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        app: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Resolve immutable image reference
        id: image
        env:
          REQUESTED_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          tag="$REQUESTED_TAG"
          if [ -z "$tag" ]; then tag="$GITHUB_SHA"; fi
          echo "ref=ghcr.io/${GITHUB_REPOSITORY}-${{ matrix.app }}:${tag}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: inputs.push_images == true
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image from monorepo root
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/${{ matrix.app }}/Dockerfile
          push: ${{ inputs.push_images == true }}
          tags: ${{ steps.image.outputs.ref }}
          cache-from: type=gha,scope=game-plug-${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=game-plug-${{ matrix.app }}
          build-args: |
            NEXT_PUBLIC_API_URL=https://game-plug.rbw.ovh
