services:
  game-plug:
    image: node:24-alpine
    container_name: game-plug
    restart: unless-stopped
    working_dir: /app
    command: sh -c "npm run dev"
    volumes:
      - .:/app
    environment:
      - NODE_ENV=development
      - PORT=5000
      - DATABASE_URL=postgresql://devuser:devpassword@dev_postgres:5432/game_plug
      - REDIS_URL=redis://dev_redis:6379
      - S3_ENDPOINT=http://dev_minio:9000
      - S3_ACCESS_KEY_ID=minioadmin
      - S3_SECRET_ACCESS_KEY=minioadmin123
    networks:
      - traefik_public
      - dev_network
    labels:
      - traefik.enable=true
      - traefik.http.routers.game-plug.rule=Host(`game-plug.rbw.ovh`) || Host(`game-plug.robinswood.io`)
      - traefik.http.routers.game-plug.entrypoints=websecure
      - traefik.http.routers.game-plug.tls=true
      - traefik.http.routers.game-plug.tls.certresolver=letsencrypt
      - traefik.http.services.game-plug.loadbalancer.server.port=5000

networks:
  traefik_public:
    external: true
  dev_network:
    external: true
