# Game Plug RPG Application
location /game-plug/ {
    # Désactiver l'authentification OAuth2 pour Game Plug
    auth_request off;

    # Rewrite pour enlever le préfixe /game-plug/ avant de proxy
    rewrite ^/game-plug/(.*) /$1 break;

    # Headers proxy standard
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Prefix /game-plug;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;

    # Proxy vers Game Plug (utilise host.docker.internal pour accéder à l'hôte Docker)
    proxy_pass http://172.18.0.1:5002;
    proxy_http_version 1.1;

    # WebSocket support (nécessaire pour la synchronisation temps réel)
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    # Timeouts pour WebSocket et longues requêtes
    proxy_read_timeout 86400;
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;

    # Upload size pour images et avatars
    client_max_body_size 100M;
}

# Support pour les assets
location /game-plug/assets/ {
    auth_request off;
    rewrite ^/game-plug/(.*) /$1 break;
    proxy_pass http://172.18.0.1:5002;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
}

# Support pour les avatars générés
location /game-plug/avatars/ {
    auth_request off;
    rewrite ^/game-plug/(.*) /$1 break;
    proxy_pass http://172.18.0.1:5002;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
}
