# Configuration Nginx pour game-plug.robinswood.io
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name game-plug.robinswood.io;

    # SSL Configuration (certificates gérés par le système principal)
    ssl_certificate /etc/letsencrypt/live/robinswood.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/robinswood.io/privkey.pem;

    # SSL Settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Logs
    access_log /var/log/nginx/game-plug.access.log;
    error_log /var/log/nginx/game-plug.error.log;

    # Root location
    location / {
        # Pas d'authentification OAuth2 pour Game Plug
        auth_request off;

        # Headers proxy standard
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # Proxy vers Game Plug (accès au réseau Docker)
        proxy_pass http://172.18.0.1:5002;
        proxy_http_version 1.1;

        # WebSocket support (nécessaire pour la synchronisation temps réel)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts pour WebSocket et longues requêtes
        proxy_read_timeout 86400;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;

        # Upload size pour images et avatars
        client_max_body_size 100M;
    }

    # Support pour les assets
    location /assets/ {
        auth_request off;
        proxy_pass http://172.18.0.1:5002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;

        # Cache pour les assets statiques
        proxy_cache_valid 200 1d;
        expires 1d;
        add_header Cache-Control "public, immutable";
    }

    # Support pour les avatars générés
    location /avatars/ {
        auth_request off;
        proxy_pass http://172.18.0.1:5002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;

        # Cache pour les avatars
        proxy_cache_valid 200 7d;
        expires 7d;
        add_header Cache-Control "public";
    }

    # API endpoints
    location /api/ {
        auth_request off;
        proxy_pass http://172.18.0.1:5002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket pour les API en temps réel
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# Redirect HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name game-plug.robinswood.io;

    return 301 https://$server_name$request_uri;
}
