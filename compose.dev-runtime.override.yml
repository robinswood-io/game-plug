services:
  game-plug:
    image: oven/bun:1.3.14-alpine
    pull_policy: if_not_present
    user: "1000:1002"
    working_dir: /app
    environment:
      NODE_ENV: production
    command:
      - bun
      - run
      - --cwd
      - apps/frontend
      - start
      - --hostname
      - 0.0.0.0
      - --port
      - "5000"
    volumes:
      - /srv/workspace/game-plug:/app
      - /srv/workspace/game-plug/node_modules:/app/node_modules
  game-plug-backend:
    image: oven/bun:1.3.14-alpine
    pull_policy: if_not_present
    user: "1000:1002"
    working_dir: /app
    command:
      - sh
      - -c
      - set -a; . /app/.env; set +a; exec bun apps/backend/dist/apps/backend/src/main.js
    volumes:
      - /srv/workspace/game-plug:/app
      - /srv/workspace/game-plug/node_modules:/app/node_modules
